name: build

# First stage of the build -> publish pipeline. Everything that can be
# validated without publishing lives here:
#   - process graphs: renders each model's process_graph.json from
#     process_graph.json.j2 + udf.py and fails when the render or its runtime
#     reference is invalid; also renders README.md.j2 to catch template errors
#     (see scripts/build-process-graph.py)
#   - dependency archives: builds every runtimes/*/requirements.txt into a
#     deterministic dependencies.zip and smoke-tests the imports on the pinned
#     Python. Publishing is deliberately not automated; see publish.yml.
#
# It runs on every push and pull request, not only on changes that touch the
# build inputs: publish.yml is triggered by this workflow's completion, so a
# successful build run must exist for every commit that may be published.
# Unchanged archives are restored from the cache instead of rebuilt.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # head_ref makes a fork/same-repo PR run and its branch push share a group,
  # so superseded builds cancel each other instead of piling up.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  process-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Render and validate process graphs and model READMEs
        run: |
          set -euo pipefail
          found=0
          failed=()
          for dir in models/*/; do
            [ -f "$dir/udf.py" ] || continue
            if [ ! -f "$dir/process_graph.json.j2" ]; then
              echo "$dir has udf.py but no process_graph.json.j2" >&2
              exit 1
            fi
            found=$((found + 1))
            if ! uv run scripts/build-process-graph.py "${dir%/}" --check; then
              failed+=("${dir%/}")
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "no model directories with udf.py and process_graph.json.j2 found" >&2
            exit 1
          fi
          if [ ${#failed[@]} -gt 0 ]; then
            echo
            echo "process graph check failed in: ${failed[*]}" >&2
            echo "run: uv run scripts/build-process-graph.py <dir>" >&2
            exit 1
          fi
          echo "checked $found process graph(s)"

  dependency-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "runtimes/*/requirements.txt"

      - name: Restore unchanged archives
        id: cache
        uses: actions/cache@v4
        with:
          path: runtimes/*/dependencies.zip
          key: dependency-archives-${{ hashFiles('runtimes/*/requirements.txt', 'scripts/create-python-dependency-archive.py') }}

      - name: Build archives
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          requirements=(runtimes/*/requirements.txt)
          if [ ${#requirements[@]} -eq 0 ]; then
            echo "no runtimes/*/requirements.txt found" >&2
            exit 1
          fi
          for req in "${requirements[@]}"; do
            uv run scripts/create-python-dependency-archive.py \
              --requirements "$req" \
              --output-file "$(dirname "$req")/dependencies.zip"
          done

      - name: Smoke-test on the pinned Python version
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1  # torch CPU
          for zip in runtimes/*/dependencies.zip; do
            runtime="$(basename "$(dirname "$zip")")"
            version="$(sed -E 's/^py([0-9])([0-9]+).*/\1.\2/' <<<"$runtime")"
            uv python install "$version"
            python="$(uv python find "$version")"

            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"

            "$python" - "$workdir" <<'PY'
          import importlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          sys.path.insert(0, str(root))
          modules = sorted(
              path.name
              for path in root.iterdir()
              if path.is_dir() and (path / "__init__.py").is_file()
          )
          if not modules:
              raise SystemExit(f"archive root has no importable packages: {root}")
          for module in modules:
              importlib.import_module(module)
          print(f"imported {len(modules)} packages: {', '.join(modules)}")
          PY

            rm -rf "$workdir"
          done

      - name: Record checksums
        run: sha256sum runtimes/*/dependencies.zip | tee checksums.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-archives
          path: |
            runtimes/*/dependencies.zip
            runtimes/*/requirements.txt
            checksums.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
