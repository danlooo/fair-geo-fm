name: test

# Smoke-test the documented openEO example of every model on CDSE, plus the
# Web editor, Python and R usage examples a model page documents.
#
# This is the release gate: publish-release.yml calls this workflow before its
# Zenodo job, so a release whose example does not run is never uploaded. It can
# also be started by hand from the Actions tab to test a branch or tag without
# releasing it.
#
# Deliberately no `release` trigger: publish-release.yml is the single release
# entry point and calls this workflow once for the tag. Adding `release` here
# would run every example a second time for the same release.
#
# Authentication uses OIDC client credentials (the only non-interactive option
# on CDSE). The OPENEO_AUTH_CLIENT_ID and OPENEO_AUTH_CLIENT_SECRET repository
# secrets belong to a CDSE service account or Sentinel Hub OAuth client;
# create one at https://shapps.dataspace.copernicus.eu/dashboard/#/account/settings.
# See "openEO credentials for the test workflow" in CONTRIBUTING.md.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (a release tag when called from publish-release)"
        required: false
        type: string
        default: ""
    secrets:
      OPENEO_AUTH_CLIENT_ID:
        required: true
      OPENEO_AUTH_CLIENT_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: the branch selected in the UI)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: discover models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.models.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Find model directories
        id: models
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          models = sorted(
              path.name
              for path in Path("models").iterdir()
              if path.is_dir()
              and (path / "config.json").is_file()
              and (path / "process_graph.json.j2").is_file()
          )
          if not models:
              raise SystemExit("no model directories with a process graph template found")

          # One matrix entry per model example and per documented client
          # example. Both groups share a single matrix so that max-parallel
          # below caps how many of them run at once together.
          jobs = [{"name": model, "model": model, "client": ""} for model in models]
          jobs += [
              {"name": f"docs example ({client})", "model": "alphaearth", "client": client}
              for client in ("web", "python", "r")
          ]
          print(f"jobs={json.dumps(jobs)}")
          PY

  # One job per model example and per documented client example. Both groups
  # share a single matrix (built by discover) so that max-parallel caps how
  # many jobs of either kind run at once in total: they run in parallel with
  # each other, but never more than four at a time.
  #
  # A model page documents Web editor, Python and R examples extracted from the
  # page rendered by models/model.md.j2, so these jobs fail when a documented
  # snippet breaks. AlphaEarth is the representative model: it is built only
  # from openEO processes (no UDF or runtime archive) and every model page is
  # generated from the same template. Add models to the matrix if a
  # model-specific example needs coverage too.
  #
  # The snippet examples resolve the process graph over the network, so they
  # run against the public staging site (the script default) even for a
  # release: a draft Zenodo record is private and cannot be fetched by CDSE.
  examples:
    name: ${{ matrix.name }}
    needs: discover
    runs-on: ubuntu-latest
    # One model per job so a slow model does not use up another model's time
    # and a failure in one model does not hide the results of the others.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Every job shares one CDSE service account, so cap how many jobs run at
      # the same time: launching all models at once gets the account
      # rate-limited (429). The snippet examples are the most sensitive to
      # this because they cannot use the retry policy test-models.py applies
      # to its own requests.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Set up R
        if: matrix.client == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The Linux binaries of `sf` and `units` (pulled in by `openeo`) link
      # against the system PROJ, GEOS, GDAL and UDUNITS libraries. Without them
      # the packages install fine but their namespaces fail to load at run
      # time, so install the libraries first and load both packages to check.
      - name: Install R packages
        if: matrix.client == 'r'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
          Rscript -e 'install.packages(c("openeo", "jsonlite"))'
          Rscript -e 'library(openeo); library(jsonlite)'

      - name: Run the documented example
        if: matrix.client == ''
        env:
          OPENEO_AUTH_CLIENT_ID: ${{ secrets.OPENEO_AUTH_CLIENT_ID }}
          OPENEO_AUTH_CLIENT_SECRET: ${{ secrets.OPENEO_AUTH_CLIENT_SECRET }}
          OPENEO_AUTH_PROVIDER_ID: ${{ vars.OPENEO_AUTH_PROVIDER_ID }}
          OPENEO_BACKEND: https://openeo.dataspace.copernicus.eu
        run: >-
          uv run scripts/test-models.py
          --model "${{ matrix.model }}"
          --version "${{ inputs.ref || github.ref_name }}"
          --timeout-minutes 150

      - name: Run the documented ${{ matrix.client }} example
        if: matrix.client != ''
        env:
          OPENEO_AUTH_CLIENT_ID: ${{ secrets.OPENEO_AUTH_CLIENT_ID }}
          OPENEO_AUTH_CLIENT_SECRET: ${{ secrets.OPENEO_AUTH_CLIENT_SECRET }}
          OPENEO_AUTH_PROVIDER_ID: ${{ vars.OPENEO_AUTH_PROVIDER_ID }}
          OPENEO_BACKEND: https://openeo.dataspace.copernicus.eu
        run: >-
          uv run scripts/test-models.py
          --model "${{ matrix.model }}"
          --client "${{ matrix.client }}"
          --version "${{ inputs.ref || github.ref_name }}"
          --timeout-minutes 150
