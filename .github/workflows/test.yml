name: test

# Smoke-test the documented openEO example of every model on CDSE, plus the
# Web editor, Python and R usage examples a model page documents.
#
# This is the release gate: publish-release.yml calls this workflow before its
# Zenodo job, so a release whose example does not run is never uploaded. It can
# also be started by hand from the Actions tab to test a branch or tag without
# releasing it.
#
# Deliberately no `release` trigger: publish-release.yml is the single release
# entry point and calls this workflow once for the tag. Adding `release` here
# would run every example a second time for the same release.
#
# Authentication uses OIDC client credentials (the only non-interactive option
# on CDSE). The OPENEO_AUTH_CLIENT_ID and OPENEO_AUTH_CLIENT_SECRET repository
# secrets belong to a CDSE service account or Sentinel Hub OAuth client;
# create one at https://shapps.dataspace.copernicus.eu/dashboard/#/account/settings.
# See "openEO credentials for the test workflow" in CONTRIBUTING.md.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (a release tag when called from publish-release)"
        required: false
        type: string
        default: ""
    secrets:
      OPENEO_AUTH_CLIENT_ID:
        required: true
      OPENEO_AUTH_CLIENT_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: the branch selected in the UI)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: discover models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Find model directories
        id: models
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          models = sorted(
              path.name
              for path in Path("models").iterdir()
              if path.is_dir()
              and (path / "config.json").is_file()
              and (path / "process_graph.json.j2").is_file()
          )
          if not models:
              raise SystemExit("no model directories with a process graph template found")
          print(f"models={json.dumps(models)}")
          PY

  # One job per model example.
  examples:
    name: ${{ matrix.model }}
    needs: discover
    runs-on: ubuntu-latest
    # One model per job so a slow model does not use up another model's time
    # and a failure in one model does not hide the results of the others.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Every job shares one CDSE service account, so cap how many models run
      # at the same time: launching one job per model at once gets the account
      # rate-limited (429).
      max-parallel: 3
      matrix:
        model: ${{ fromJSON(needs.discover.outputs.models) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Run the documented example
        env:
          OPENEO_AUTH_CLIENT_ID: ${{ secrets.OPENEO_AUTH_CLIENT_ID }}
          OPENEO_AUTH_CLIENT_SECRET: ${{ secrets.OPENEO_AUTH_CLIENT_SECRET }}
          OPENEO_AUTH_PROVIDER_ID: ${{ vars.OPENEO_AUTH_PROVIDER_ID }}
          OPENEO_BACKEND: https://openeo.dataspace.copernicus.eu
        run: >-
          uv run scripts/test-models.py
          --model "${{ matrix.model }}"
          --version "${{ inputs.ref || github.ref_name }}"
          --timeout-minutes 150
          --stats-file job-statistics.csv

      # Keep one CSV per matrix job and merge them in the statistics job. No
      # retention-days here: the artifact lives as long as the repository
      # keeps artifacts (GitHub always enforces its configured maximum).
      - name: Upload job statistics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-statistics-models-${{ matrix.model }}
          path: job-statistics.csv
          if-no-files-found: ignore

  # One job per documented client example. A model page documents Web editor,
  # Python and R examples extracted from the page rendered by
  # models/model.md.j2, so these jobs fail when a documented snippet breaks.
  #
  # AlphaEarth is the representative model: it is built only from openEO
  # processes (no UDF or runtime archive) and every model page is generated
  # from the same template. Add models to the matrix if a model-specific
  # example needs coverage too.
  #
  # The snippet examples resolve the process graph over the network, so they
  # run against the public staging site (the script default) even for a
  # release: a draft Zenodo record is private and cannot be fetched by CDSE.
  #
  # This group does not wait for the model examples: both groups run in
  # parallel, each capped at three concurrent jobs. They share one CDSE service
  # account, so the total can reach six at once (three models, three clients);
  # if that triggers rate limiting (429), lower max-parallel here.
  clients:
    name: docs example (${{ matrix.client }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        client: [web, python, r]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Set up R
        if: matrix.client == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The Linux binaries of `sf` and `units` (pulled in by `openeo`) link
      # against the system PROJ, GEOS, GDAL and UDUNITS libraries. Without them
      # the packages install fine but their namespaces fail to load at run
      # time, so install the libraries first and load both packages to check.
      - name: Install R packages
        if: matrix.client == 'r'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
          Rscript -e 'install.packages(c("openeo", "jsonlite"))'
          Rscript -e 'library(openeo); library(jsonlite)'

      - name: Run the documented ${{ matrix.client }} example
        env:
          OPENEO_AUTH_CLIENT_ID: ${{ secrets.OPENEO_AUTH_CLIENT_ID }}
          OPENEO_AUTH_CLIENT_SECRET: ${{ secrets.OPENEO_AUTH_CLIENT_SECRET }}
          OPENEO_AUTH_PROVIDER_ID: ${{ vars.OPENEO_AUTH_PROVIDER_ID }}
          OPENEO_BACKEND: https://openeo.dataspace.copernicus.eu
        run: >-
          uv run scripts/test-models.py
          --model alphaearth
          --client "${{ matrix.client }}"
          --version "${{ inputs.ref || github.ref_name }}"
          --timeout-minutes 150
          --stats-file job-statistics.csv

      - name: Upload job statistics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-statistics-clients-${{ matrix.client }}
          path: job-statistics.csv
          if-no-files-found: ignore

  # Merge the per-matrix statistics into one CSV. Runs even when a test job
  # failed so partial results are kept; the artifact is not deleted by the
  # workflow (retention follows the repository setting).
  statistics:
    name: job statistics
    needs: [examples, clients]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download per-job statistics
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          # Each artifact is extracted into its own subdirectory, so the
          # matrix jobs' identical `job-statistics.csv` names do not collide.
          pattern: job-statistics-*
          path: statistics

      - name: Merge job statistics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          columns = [
              "cdse_job_id", "github_actions_job_id", "job_name",
              "subjob_name", "job_time", "cdse_time", "used_credits",
              "used_cpu", "used_cpu_unit", "used_ram", "used_ram_unit",
          ]
          rows = {}
          for path in sorted(Path("statistics").rglob("*.csv")):
              with path.open(newline="") as handle:
                  for row in csv.DictReader(handle):
                      job_id = row.get("cdse_job_id")
                      if not job_id:
                          continue
                      # The same job can be seen by a snippet's job-list diff
                      # and by its owner; keep the first non-empty value.
                      merged = rows.setdefault(job_id, {column: "" for column in columns})
                      for column in columns:
                          if not merged[column] and row.get(column):
                              merged[column] = row[column]

          out = Path("job-statistics.csv")
          with out.open("w", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=columns)
              writer.writeheader()
              writer.writerows(rows[job_id] for job_id in sorted(rows))
          print(f"wrote {out} with {len(rows)} job(s)")
          PY

      - name: Upload job statistics
        uses: actions/upload-artifact@v7
        with:
          name: job-statistics
          path: job-statistics.csv
