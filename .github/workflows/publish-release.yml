name: publish-release

# Archive a released version on Zenodo. A maintainer creates the GitHub release
# by hand (that is the release decision); this workflow adds a new version to
# the project's concept record (10.5281/zenodo.24193626) and uploads the
# rendered process graphs and runtime archives to it:
#
#   https://zenodo.org/records/<record-id>/files/models/<model>/process_graph.json
#   https://zenodo.org/records/<record-id>/files/runtimes/<runtime>.zip
#   https://zenodo.org/records/<record-id>/files/danlooo/fair-geo-fm-<version>.zip
#
# The last file is the complete source tree exported with `git archive` from
# the released ref, so the record also archives the code that produced it.
#
# The DOI is reserved before anything is uploaded. Process graphs are rendered
# against the record's file URL, so the graph shipped in the record references
# the record's own runtime URL; the DOI remains the citable identifier. The
# record is published last.
#
# Zenodo's automatic GitHub integration cannot be used: it archives a single
# repository snapshot under Zenodo's own paths, while the layout above needs
# several files under custom paths. Hence scripts/publish-release.py talks to
# the InvenioRDM REST API documented at
# <https://inveniordm.docs.cern.ch/reference/rest_api_drafts_records/>.
#
# Authentication: the repository secret ZENODO_ACCESS_TOKEN, with the
# `deposit:write` and `deposit:actions` scopes.
#
# `workflow_dispatch` re-runs a release. dry_run defaults to true: it creates a
# deposition, reserves a DOI, renders and uploads everything, then deletes the
# draft. Set ZENODO_API_URL to the sandbox API to test without touching the
# production record space.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string
      dry_run:
        description: "Render and upload, then delete the draft instead of publishing"
        required: false
        default: true
        type: boolean
      creators:
        description: 'Zenodo creators as JSON, e.g. [{"name":"Loos, Daniel","orcid":"0000-0002-4024-4443"}]'
        required: false
        default: '[{"name":"Loos, Daniel","orcid":"0000-0002-4024-4443"}]'
        type: string
      deposition_id:
        description: "Retry an existing draft version id (empty = open a new version of the concept record)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  zenodo:
    name: upload release to Zenodo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protect the record space with required reviewers, like the old publish
    # environment: releases are never automatic.
    environment: release
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "runtimes/*/requirements.txt"

      - name: Build runtime archives
        # Published archives are built from the released tag, not taken from a
        # branch artifact, and are deterministic for a pinned requirements.txt.
        run: |
          set -euo pipefail
          shopt -s nullglob
          requirements=(runtimes/*/requirements.txt)
          if [ ${#requirements[@]} -eq 0 ]; then
            echo "no runtimes/*/requirements.txt found" >&2
            exit 1
          fi
          for req in "${requirements[@]}"; do
            uv run scripts/create-python-dependency-archive.py \
              --requirements "$req" \
              --output-file "$(dirname "$req")/dependencies.zip"
          done

      - name: Upload to Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          ZENODO_API_URL: ${{ vars.ZENODO_API_URL || 'https://zenodo.org/api' }}
          ZENODO_CONCEPT_DOI: ${{ vars.ZENODO_CONCEPT_DOI || '10.5281/zenodo.24193626' }}
          CREATORS: '${{ github.event_name == ''workflow_dispatch'' && inputs.creators || ''[{"name":"Loos, Daniel","orcid":"0000-0002-4024-4443"}]'' }}'
          DRY_RUN: '${{ github.event_name == ''workflow_dispatch'' && inputs.dry_run || ''false'' }}'
          DEPOSITION_ID: ${{ inputs.deposition_id }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION"
            --concept-doi "$ZENODO_CONCEPT_DOI"
            --creators-json "$CREATORS"
          )
          if [ -n "$DEPOSITION_ID" ]; then
            args+=(--deposition-id "$DEPOSITION_ID")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          uv run scripts/publish-release.py "${args[@]}"
