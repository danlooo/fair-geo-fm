name: publish

# Second stage of the build -> publish pipeline for the staging site. Nothing is
# published unless a `build` run for the commit has completed successfully, so a
# commit that breaks a process graph or dependency archive is never deployed.
#
# Every successful push build publishes the documentation site and the
# staging process graphs and runtimes: the newest v* tag is the current version
# and the site root redirects to it; every other branch and v* tag that
# contains a site is archived into the same build by
# scripts/prepare-docs.mjs, so all versions are published at once and the
# version switcher links between them:
#
#   https://danlooo.github.io/fair-geo-fm/          -> /v0.1/
#   https://danlooo.github.io/fair-geo-fm/v0.1/
#   https://danlooo.github.io/fair-geo-fm/main/
#
# The default branch is the staging target. Process graphs are rendered from
# models/*/process_graph.json.j2 with this base URL, and the build job's runtime
# archives are served at a fixed path, replacing them on every deployment:
#
#   https://danlooo.github.io/fair-geo-fm/main/models/<model>/process_graph.json
#   https://danlooo.github.io/fair-geo-fm/main/runtimes/<runtime>.zip
#
# Released, citable versions are uploaded to Zenodo by publish-release.yml after
# a maintainer creates a GitHub release. `workflow_dispatch` republishes the
# site by hand.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: require successful build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check build status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # A pull request build is not a publishing candidate.
            if [ "${{ github.event.workflow_run.event }}" = "push" ] &&
               [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              ok=true
            fi
            echo "build ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.head_sha }}): ${{ github.event.workflow_run.event }} -> ${{ github.event.workflow_run.conclusion }}"
          else
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
            if [ "$count" -gt 0 ]; then
              ok=true
            else
              echo "refusing to publish: no successful build for $GITHUB_SHA" >&2
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$ok" != "true" ]; then
            echo "run the build workflow for this commit first" >&2
            exit 1
          fi

  documentation:
    needs: verify-build
    if: needs.verify-build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@v4
        with:
          # Everything is read from git: the newest v* tag is the current
          # version and the other refs are archived, so every trigger produces
          # the same site.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve the current version
        # The site root redirects to the newest release, so its pages come from
        # that tag rather than from the default branch, which may be ahead of it.
        run: |
          set -euo pipefail
          newest="$(git tag --list 'v*' --sort=version:refname | tail -n 1)"
          if [ -n "$newest" ]; then
            echo "DOCS_CURRENT_VERSION=$newest" >> "$GITHUB_ENV"
            echo "DOCS_CURRENT_REF=refs/tags/$newest" >> "$GITHUB_ENV"
          else
            # Before the first release the default branch is the current version.
            echo "DOCS_CURRENT_VERSION=${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"
            echo "DOCS_CURRENT_REF=origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Render staging process graphs
        # The template is the source of truth; this writes the default-branch
        # copy that prepare-docs serves. It also validates each model README
        # template, which prepare-docs renders into the versioned pages. The
        # base URL matches the Pages layout of a project site.
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main
        run: |
          set -euo pipefail
          for dir in models/*/; do
            [ -f "$dir/process_graph.json.j2" ] || continue
            uv run scripts/build-process-graph.py "${dir%/}" --base-url "$BASE_URL"
          done

      - name: Download dependency archives
        # The site serves the built runtime archives for the default branch at
        # /main/runtimes/<runtime>.zip, replacing them on every deployment. They
        # are git-ignored, so take them from the build job's artifact for the
        # current default-branch commit; prepare-docs copies them into
        # docs/public/main.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checkout above is the default branch, so HEAD is the commit
          # whose archives are published.
          main_sha="$(git rev-parse HEAD)"
          run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$main_sha&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::warning::no successful build run for $main_sha; publishing the site without dependency archives"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/archives"
          if ! gh run download "$run_id" --name dependency-archives --dir "$RUNNER_TEMP/archives"; then
            echo "::warning::build run $run_id has no dependency-archives artifact (expired?); publishing the site without dependency archives"
            exit 0
          fi
          cp -a "$RUNNER_TEMP/archives/." .
          find runtimes -name dependencies.zip -printf '%p (%s bytes)\n'

      - name: Build all versions
        # prepare-docs copies the canonical pages into docs/src, checks out each
        # other ref into docs/archive/<ref>/, then VitePress builds one site
        # with @viteplus/versions.
        run: npm run build

      - name: Verify staging process graphs
        # Model pages link to the default branch's graph at this fixed path, so
        # a missing or malformed build output must fail the deployment rather
        # than publish a dead link.
        run: |
          set -euo pipefail
          shopt -s nullglob
          graphs=(docs/public/main/models/*/process_graph.json)
          if [ ${#graphs[@]} -eq 0 ]; then
            echo "no staging process graphs prepared under docs/public/main/models" >&2
            exit 1
          fi
          for graph in "${graphs[@]}"; do
            python3 -m json.tool "$graph" >/dev/null
            echo "$graph: valid JSON"
          done

      - name: Disable Jekyll
        run: touch docs/.vitepress/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Compute deployment version
        id: version
        run: |
          # deploy-pages sends GITHUB_SHA as the Pages build version, and Pages
          # does not republish an already-deployed version. Moving a tag or
          # deleting a branch does not change the commit SHA, so derive a unique
          # version per workflow run to always publish the reassembled site.
          echo "sha=$(printf '%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.version.outputs.sha }}
