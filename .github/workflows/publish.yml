name: publish

# Second stage of the build -> publish pipeline. It runs automatically: nothing
# is published unless a `build` run for the commit has completed successfully,
# so a commit that breaks a process graph or dependency archive is never
# deployed. No manual trigger is involved.
#   - every successful push build publishes the documentation site: the default
#     branch is the current version; every other branch and tag that contains a
#     site is archived into the same build by scripts/prepare-docs.mjs, so all
#     versions are published at once and the version switcher links between
#     them:
#       https://danlooo.github.io/fair-geo-fm/main/
#       https://danlooo.github.io/fair-geo-fm/v0.1/
#   - a successful default-branch build also publishes the dependency archives
#     it produced in `build`. Each release is content-addressed with its sha256,
#     so unchanged bytes resolve to the existing release instead of creating a
#     new one, and no release is ever overwritten.
#   - `workflow_dispatch` is an escape hatch, not part of the normal flow: it
#     can republish docs (target: docs) or publish a runtime archive by hand,
#     e.g. to refresh the mutable `staging` prerelease.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "What to publish"
        required: true
        default: docs
        type: choice
        options: [docs, runtime, all]
      runtime:
        description: "Runtime directory under runtimes/"
        required: false
        default: py311-torch231
        type: string
      tag:
        description: "Mutable prerelease tag, e.g. staging (empty = content-addressed)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and verify only; do not create a release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify-build:
    name: require successful build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check build status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # A pull request build is not a publishing candidate.
            if [ "${{ github.event.workflow_run.event }}" = "push" ] &&
               [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              ok=true
            fi
            echo "build ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.head_sha }}): ${{ github.event.workflow_run.event }} -> ${{ github.event.workflow_run.conclusion }}"
          else
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
            if [ "$count" -gt 0 ]; then
              ok=true
            else
              echo "refusing to publish: no successful build for $GITHUB_SHA" >&2
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$ok" != "true" ]; then
            echo "run the build workflow for this commit first" >&2
            exit 1
          fi

  documentation:
    needs: verify-build
    if: |
      needs.verify-build.outputs.ok == 'true' &&
      (github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'docs' || inputs.target == 'all')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@v4
        with:
          # The current version is always the default branch; other refs are
          # archived from git, so every trigger produces the same site.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build all versions
        # prepare-docs copies the canonical pages into docs/src, checks out each
        # other ref into docs/archive/<ref>/, then VitePress builds one site
        # with @viteplus/versions.
        run: npm run build

      - name: Disable Jekyll
        run: touch docs/.vitepress/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Compute deployment version
        id: version
        run: |
          # deploy-pages sends GITHUB_SHA as the Pages build version, and Pages
          # does not republish an already-deployed version. Moving a tag or
          # deleting a branch does not change the commit SHA, so derive a unique
          # version per workflow run to always publish the reassembled site.
          echo "sha=$(printf '%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.version.outputs.sha }}

  runtime:
    name: publish runtime archives
    needs: verify-build
    # Automatic path: every successful build of the default branch publishes the
    # archives it produced. Releases are content-addressed, so an unchanged
    # runtime resolves to its existing release instead of creating a new one.
    # Manual dispatch is an escape hatch only, e.g. to refresh the mutable
    # `staging` prerelease used while a backend is being verified.
    if: |
      needs.verify-build.outputs.ok == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'runtime' || inputs.target == 'all')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: ${{ github.workflow }}-runtime
      cancel-in-progress: false
    env:
      RUNTIME: ${{ inputs.runtime }}
      RELEASE_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the archives that the build verified
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: dependency-archives
          # The artifact belongs to another run, so pass its id and a token.
          # Publishing these exact bytes ties each release to what the build
          # smoke-tested.
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: archives

      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          enable-cache: true
          cache-dependency-glob: "runtimes/*/requirements.txt"

      - name: Build archive
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ ! "$RUNTIME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid runtime name: $RUNTIME" >&2
            exit 1
          fi
          requirements="runtimes/$RUNTIME/requirements.txt"
          if [ ! -f "$requirements" ]; then
            echo "no such runtime: $requirements" >&2
            exit 1
          fi
          uv run scripts/create-python-dependency-archive.py \
            --requirements "$requirements" \
            --output-file "runtimes/$RUNTIME/dependencies.zip"

      - name: Verify on the pinned Python version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1  # torch CPU
          version="$(sed -E 's/^py([0-9])([0-9]+).*/\1.\2/' <<<"$RUNTIME")"
          uv python install "$version"
          python="$(uv python find "$version")"

          workdir="$(mktemp -d)"
          unzip -q "runtimes/$RUNTIME/dependencies.zip" -d "$workdir"

          "$python" - "$workdir" <<'PY'
          import importlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          sys.path.insert(0, str(root))
          modules = sorted(
              path.name
              for path in root.iterdir()
              if path.is_dir() and (path / "__init__.py").is_file()
          )
          if not modules:
              raise SystemExit(f"archive root has no importable packages: {root}")
          for module in modules:
              importlib.import_module(module)
          print(f"imported {len(modules)} packages: {', '.join(modules)}")
          PY

          rm -rf "$workdir"

      - name: Stage manually built archive
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p "archives/runtimes/$RUNTIME"
          cp "runtimes/$RUNTIME/dependencies.zip" "archives/runtimes/$RUNTIME/dependencies.zip"

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(archives/runtimes/*/dependencies.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no dependency archives found under archives/runtimes/" >&2
            exit 1
          fi

          for zip in "${zips[@]}"; do
            runtime="$(basename "$(dirname "$zip")")"
            digest="$(sha256sum "$zip" | cut -d' ' -f1)"
            short="${digest:0:16}"
            mutable=false
            if [ -n "${RELEASE_TAG:-}" ] && [ "$runtime" = "${RUNTIME:-}" ]; then
              if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "invalid tag: $RELEASE_TAG" >&2
                exit 1
              fi
              tag="$RELEASE_TAG"
              asset="$runtime.zip"
              mutable=true
            else
              tag="$runtime-$short"
              asset="$runtime-$short.zip"
            fi
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"

            {
              echo "### $runtime"
              echo
              echo "- sha256: \`$digest\`"
              echo "- release: \`$tag\`"
              echo "- mutable: $mutable"
              echo "- url: $url#feature_deps"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${DRY_RUN:-}" = "true" ]; then
              echo "dry run: would publish $tag with $asset (mutable=$mutable)"
              continue
            fi

            cp "$zip" "$RUNNER_TEMP/$asset"

            if [ "$mutable" = "true" ]; then
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "mutable release $tag exists; replacing $asset"
                gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber
              else
                gh release create "$tag" \
                  --title "$tag" \
                  --prerelease \
                  --latest=false \
                  --notes "Mutable staging release for \`runtimes/$runtime\`; the asset is replaced on each publish.

          sha256: \`$digest\`
          built from \`$GITHUB_REPOSITORY@${BUILT_SHA:-$GITHUB_SHA}\`" \
                  "$RUNNER_TEMP/$asset"
              fi
              continue
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              # The tag embeds the digest of these exact bytes, so an existing
              # release means this archive was already published; only repair a
              # missing asset instead of overwriting anything.
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
                echo "release $tag already has $asset"
              else
                echo "asset missing from existing release; uploading it"
                gh release upload "$tag" "$RUNNER_TEMP/$asset"
              fi
              continue
            fi

            notes="Content-addressed dependency archive for \`runtimes/$runtime\`.

          sha256: \`$digest\`
          built from \`$GITHUB_REPOSITORY@${BUILT_SHA:-$GITHUB_SHA}\`

          Use as a job option:

          \`\`\`
          \"udf-dependency-archives\": [\"$url#feature_deps\"]
          \`\`\`"

            gh release create "$tag" \
              --title "$tag" \
              --notes "$notes" \
              --latest=false \
              "$RUNNER_TEMP/$asset"
          done
